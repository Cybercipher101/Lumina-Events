name: Validate development and authentication
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dev-auth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-8.0.16
      - run: npm ci
      - run: npm run test:server
      - run: npm run test:client -- --runInBand
      - run: npm run build
